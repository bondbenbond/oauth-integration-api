spring:
  config:
    activate:
      on-profile: prod
  security:
    oauth2:
      client:
        registration:
          auth0:
            client-id: ${AUTH0_CLIENT_ID}
            client-secret: ${AUTH0_CLIENT_SECRET}
            client-name: Auth0
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
            provider: auth0
        provider:
          auth0:
            issuer-uri: ${AUTH0_ISSUER_URI}

server:
  servlet:
    session:
      cookie:
        secure: true

app:
  ui-base-url: ${UI_BASE_URL:https://auth-ui.bondbenbond.com}
  allowed-origin: ${ALLOWED_ORIGIN:https://auth-ui.bondbenbond.com}
  debug-tokens: ${DEBUG_TOKENS:false}
