server:
  servlet:
    session:
      cookie:
        secure: false

app:
  ui-base-url: ${UI_BASE_URL:http://localhost:5173}
  allowed-origin: ${ALLOWED_ORIGIN:http://localhost:5173}
  debug-tokens: ${DEBUG_TOKENS:false}

# Provider templates (uncomment and supply values via env vars or local overrides)
spring:
  config:
    activate:
      on-profile: local
  security:
    oauth2:
      client:
        registration:
          auth0:
            client-id: ${AUTH0_CLIENT_ID}
            client-secret: ${AUTH0_CLIENT_SECRET}
            client-name: Auth0
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
            provider: auth0
