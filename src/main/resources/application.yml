spring:
  application:
    name: oauth-integration-api
  security:
    oauth2:
      client:
        registration: {}
        provider: {}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: AUTH_API_SESSION
        http-only: true
        secure: true
        same-site: lax

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  ui-base-url: ${UI_BASE_URL:https://auth-ui.bondbenbond.com}
  allowed-origin: ${ALLOWED_ORIGIN:https://auth-ui.bondbenbond.com}
  debug-tokens: ${DEBUG_TOKENS:false}
  test-resource-uris: {}
